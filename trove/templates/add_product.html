{%extends 'base.html'%}
{%load static%}
{%block title%}Add Product{%endblock%}
{% block content%}
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                {% if form.instace.id%}
                <h2 class="text-center text-warning">Update Product</h2>
                {%else%}
                <h2 class="text-center text-warning">Add Product</h2>
                {%endif%}
                <form method="POST" class="card p-3 shadow" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{form.as_p}}
                    <button class="btn btn-warning" type="submit">
                        {%if form.instace.id%}UPDATE PRODUCT {%else%}ADD PRODUCT{%endif%}</button>

                </form>
            </div>
        </div>
    </div>
{%endblock%}
